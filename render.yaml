services:
  - type: web
    name: utilgas-api
    runtime: docker
    rootDir: backend
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
